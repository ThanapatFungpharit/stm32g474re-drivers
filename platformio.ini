; PlatformIO project configuration for the STM32G474RE driver library.
;
;   pio run                      build the playground firmware and all examples
;   pio run -e nucleo_g474re -t upload   flash the playground (src/main.c)
;   pio run -e example_uart_echo -t upload   flash one example
;   pio test -e native           run the host unit tests (needs a host gcc)
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs =
    nucleo_g474re
    example_blink
    example_button_exti
    example_uart_echo
    example_uart_irq
    example_adc_read
    example_dac_wave
    example_pwm_fade
    example_timer_irq
    example_watchdog

; ---------------------------------------------------------------------------
; Settings shared by every firmware build.
[firmware]
platform = ststm32
board = nucleo_g474re
framework = cmsis
; GCC 12.3: newer than the platform default (GCC 7) and available for
; Linux x86-64/AArch64, macOS and Windows hosts.
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
build_flags =
    -std=gnu11
    -Wl,--no-warn-rwx-segments
; Warnings apply to this project's sources only, not the CMSIS framework.
build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wstrict-prototypes
    -Wmissing-prototypes
    -Wpointer-arith
    -Wcast-align
    -Wwrite-strings
    -Wconversion
    -Wno-sign-conversion
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200

; The playground firmware in src/main.c.
[env:nucleo_g474re]
extends = firmware

; Small focused examples: library sources plus examples/<name>/main.c.
[example]
extends = firmware
build_src_filter = +<*> -<main.c>

[env:example_blink]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/blink/>

[env:example_button_exti]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/button_exti/>

[env:example_uart_echo]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/uart_echo/>

[env:example_uart_irq]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/uart_irq/>

[env:example_adc_read]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/adc_read/>

[env:example_dac_wave]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/dac_wave/>

[env:example_pwm_fade]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/pwm_fade/>

[env:example_timer_irq]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/timer_irq/>

[env:example_watchdog]
extends = example
build_src_filter = ${example.build_src_filter} +<../examples/watchdog/>

; ---------------------------------------------------------------------------
; Host unit tests with register mocks (see test/README.md).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<drivers/>
    +<system/>
    +<board/>
    -<system/panic/panic.c>
    +<../test/mock/>
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Wno-unused-parameter
    -include $PROJECT_DIR/test/mock/mock_device.h
    -I $PROJECT_DIR/test/mock
    -I ${platformio.packages_dir}/framework-cmsis-stm32g4/Include
    -D UNIT_TEST_HOST=1
    -fsanitize=address,undefined
    -fno-sanitize-recover=undefined
    -fno-omit-frame-pointer
build_unflags =
    -Os
extra_scripts = test/sanitizer_link.py
